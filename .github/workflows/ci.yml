name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Rust from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Resolve the newest supported Rspack release
        run: pnpm update:rspack
      - run: pnpm format:check
      - name: Check generated TypeScript declarations
        run: cargo test --locked --workspace --lib exported_options_are_current
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Build the shared Wasm artifact
        run: pnpm build
      - name: Check package exports and declarations
        run: pnpm check:packages
      - name: Rust, SWC, and earliest/latest Rspack tests
        run: pnpm test
      - name: Inspect the distributable package
        run: |
          for package in packages/*; do
            (cd "$package" && pnpm pack --pack-destination "${{ runner.temp }}")
          done
