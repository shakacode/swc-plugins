name: Publish package

on:
  workflow_run:
    workflows: [Release tag]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      package: ${{ steps.release.outputs.package }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Verify the release tag using trusted main code
        id: release
        run: node scripts/verify-release-tag.mts --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}

  publish:
    needs: verify
    environment: npm
    concurrency:
      group: publish-${{ needs.verify.outputs.package }}
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install Rust from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Resolve the newest supported Rspack release
        run: pnpm update rspack-latest
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Check package exports and declarations
        run: pnpm check:packages
      - run: pnpm test
      - name: Publish tagged package and GitHub release
        run: node scripts/release.mts --publish "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
