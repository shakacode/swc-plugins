[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde_json = "1.0"
swc_core = { version = "=77.0.0", features = ["common", "ecma_ast", "ecma_visit"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
